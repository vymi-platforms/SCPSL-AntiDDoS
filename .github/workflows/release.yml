name: Publish Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release AntiDDoS
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build AntiDDoS Plugin (Release)
        run: |
          dotnet build AntiDDoS/AntiDDoS.csproj -c Release

      - name: Generate Release Notes
        id: release_notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Processing tag: $TAG"

          # Attempt to find the previous tag relative to current tag
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)

          cat << 'EOF' > release_body.md
          ## 🛡️ AntiDDoS Release

          > **Note:** This plugin is part of the **Baleygr** DDoS protection suite by **Vymi**.
          > *Please note: this plugin alone will not protect against many types of attacks (volumetric L3/L4 floods, UDP amplification/reflection, line saturation). For comprehensive server protection, contact us at:* **`mail@wexels.dev`**.

          ---

          EOF

          if [ -n "$PREV_TAG" ]; then
            echo "Previous tag found: $PREV_TAG"
            echo "### 📝 Commits relative to \`$PREV_TAG\`:" >> release_body.md
            echo "" >> release_body.md
            RANGE="${PREV_TAG}..${TAG}"
          else
            echo "No previous tag found, listing commits for $TAG."
            echo "### 📝 Commits in this release:" >> release_body.md
            echo "" >> release_body.md
            RANGE="${TAG}"
          fi

          COUNT=0
          while IFS="|" read -r commit_hash subject author; do
            [ -z "$commit_hash" ] && continue
            COUNT=$((COUNT + 1))
            short_hash="${commit_hash:0:7}"
            
            # Fetch the actual GitHub username associated with the commit author email
            gh_user=$(gh api "repos/${{ github.repository }}/commits/${commit_hash}" --jq '.author.login' 2>/dev/null || true)
            
            if [ -n "$gh_user" ] && [ "$gh_user" != "null" ]; then
              echo "* ${subject} ([${short_hash}](https://github.com/${{ github.repository }}/commit/${commit_hash})) — by @${gh_user}" >> release_body.md
            else
              echo "* ${subject} ([${short_hash}](https://github.com/${{ github.repository }}/commit/${commit_hash})) — by **${author}**" >> release_body.md
            fi
          done < <(git log "${RANGE}" --pretty=format:"%H|%s|%an")

          if [ "$COUNT" -eq 0 ]; then
            echo "* No new commits found." >> release_body.md
          fi

          echo "" >> release_body.md
          echo "---" >> release_body.md
          echo "### 📦 Artifacts:" >> release_body.md
          echo "- \`AntiDDoS.dll\` — LabAPI plugin binary" >> release_body.md
          echo "- \`AntiDDoS.pdb\` — Debug symbols" >> release_body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release_body.md
          files: |
            AntiDDoS/bin/Release/net48/AntiDDoS.dll
            AntiDDoS/bin/Release/net48/AntiDDoS.pdb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
