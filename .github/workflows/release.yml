name: Publish Release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release AntiDDoS
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup SteamCMD
        uses: buildalon/setup-steamcmd@v1

      - name: Download SCP:SL Dedicated Server via SteamCMD
        shell: bash
        run: |
          mkdir -p _deps
          steamcmd +force_install_dir "$GITHUB_WORKSPACE/scpsl_server" +login anonymous +app_update 996560 validate +quit
          
          # Copy managed game DLLs to _deps
          cp scpsl_server/SCPSL_Data/Managed/Assembly-CSharp.dll _deps/
          cp scpsl_server/SCPSL_Data/Managed/Assembly-CSharp.dll _deps/Assembly-CSharp_publicized.dll
          cp scpsl_server/SCPSL_Data/Managed/Mirror.dll _deps/
          cp scpsl_server/SCPSL_Data/Managed/Mirror.dll _deps/Mirror_publicized.dll
          cp scpsl_server/SCPSL_Data/Managed/UnityEngine*.dll _deps/
          cp scpsl_server/SCPSL_Data/Managed/System*.dll _deps/ 2>/dev/null || true
          cp scpsl_server/SCPSL_Data/Managed/mscorlib.dll _deps/ 2>/dev/null || true
          cp scpsl_server/SCPSL_Data/Managed/netstandard.dll _deps/ 2>/dev/null || true

      - name: Download LabAPI & Harmony
        shell: bash
        run: |
          curl -sL "https://github.com/northwood-studios/LabAPI/releases/latest/download/LabApi.dll" -o _deps/LabApi.dll
          if [ ! -f "_deps/0Harmony.dll" ]; then
            curl -sL "https://www.nuget.org/api/v2/package/Lib.Harmony/2.3.3" -o harmony.zip
            unzip -q -o harmony.zip "lib/net48/0Harmony.dll" -d tmp_harmony || unzip -q -o harmony.zip "lib/net45/0Harmony.dll" -d tmp_harmony
            mv tmp_harmony/lib/*/0Harmony.dll _deps/0Harmony.dll
            rm -rf tmp_harmony harmony.zip
          fi

      - name: Build AntiDDoS Plugin (Release)
        run: |
          dotnet build AntiDDoS/AntiDDoS.csproj -c Release

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        id: release_notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Processing tag: $TAG"

          # Attempt to find the previous tag relative to current tag
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)

          cat << 'EOF' > release_body.md
          ## 🛡️ AntiDDoS Release

          > **Note:** This plugin is part of the **Baleygr** DDoS protection suite by **Vymi**.
          > *Please note: this plugin alone will not protect against many types of attacks (volumetric L3/L4 floods, UDP amplification/reflection, line saturation). For comprehensive server protection, contact us at:* **`mail@wexels.dev`**.

          ---

          EOF

          if [ -n "$PREV_TAG" ]; then
            echo "Previous tag found: $PREV_TAG"
            echo "### 📝 Commits relative to \`$PREV_TAG\`:" >> release_body.md
            echo "" >> release_body.md
            RANGE="${PREV_TAG}..${TAG}"
          else
            echo "No previous tag found, listing commits for $TAG."
            echo "### 📝 Commits in this release:" >> release_body.md
            echo "" >> release_body.md
            RANGE="${TAG}"
          fi

          COUNT=0
          while IFS="|" read -r commit_hash subject author; do
            [ -z "$commit_hash" ] && continue
            COUNT=$((COUNT + 1))
            short_hash="${commit_hash:0:7}"
            
            # Fetch the actual GitHub username associated with the commit author email
            gh_user=$(gh api "repos/${{ github.repository }}/commits/${commit_hash}" --jq '.author.login' 2>/dev/null || true)
            
            if [ -n "$gh_user" ] && [ "$gh_user" != "null" ]; then
              echo "* ${subject} ([${short_hash}](https://github.com/${{ github.repository }}/commit/${commit_hash})) — by @${gh_user}" >> release_body.md
            else
              echo "* ${subject} ([${short_hash}](https://github.com/${{ github.repository }}/commit/${commit_hash})) — by **${author}**" >> release_body.md
            fi
          done < <(git log "${RANGE}" --pretty=format:"%H|%s|%an")

          if [ "$COUNT" -eq 0 ]; then
            echo "* No new commits found." >> release_body.md
          fi

          echo "" >> release_body.md
          echo "---" >> release_body.md
          echo "### 📦 Artifacts:" >> release_body.md
          echo "- \`AntiDDoS.dll\` — LabAPI plugin binary" >> release_body.md
          echo "- \`AntiDDoS.pdb\` — Debug symbols" >> release_body.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release_body.md
          files: |
            AntiDDoS/bin/Release/net48/AntiDDoS.dll
            AntiDDoS/bin/Release/net48/AntiDDoS.pdb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
